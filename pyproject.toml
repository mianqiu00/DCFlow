[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcflow"
version = "1.0.0"
description = "Target-conditioned cyclic peptide inference with delayed-coupling flows"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy<2", "scipy>=1.10", "biopython>=1.81", "einops>=0.6", "easydict>=1.10", "tqdm>=4.65"]

[tool.setuptools.packages.find]
include = ["dcflow*"]
